<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ministro da Economia - Jogo de Decisões</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a2a2f 0%, #1b5a5a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #fef8ec;
            border-radius: 48px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* Header ministerial */
        .minister-header {
            background: #0f2f2a;
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 4px solid #f0b341;
        }

        .title-area h1 {
            color: #ffdfa5;
            font-size: 1.5rem;
        }

        .title-area p {
            color: #b9cfb0;
            font-size: 0.8rem;
        }

        .score-area {
            background: #1e4548;
            padding: 8px 22px;
            border-radius: 60px;
            color: #f8d98c;
            font-weight: bold;
            font-size: 1.4rem;
        }

        /* indicadores de mandato */
        .indicators {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            background: #2c564b;
            padding: 14px 24px;
            gap: 12px;
        }

        .indicator {
            background: #1b403b;
            border-radius: 32px;
            padding: 8px 14px;
            color: #ffeaac;
            text-align: center;
        }

        .indicator span:first-child {
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .indicator-value {
            font-size: 1.6rem;
            font-weight: 800;
        }

        /* área de decisão */
        .decision-area {
            padding: 28px 28px 24px;
        }

        .question-card {
            background: #fff3e0;
            border-radius: 36px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 0 #e2cfaa;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2b5548;
            margin-bottom: 12px;
        }

        .context {
            color: #5f735a;
            margin-bottom: 24px;
            font-style: italic;
            border-left: 4px solid #f3b33d;
            padding-left: 16px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #e9ddc3;
            border: 2px solid #cfb67a;
            border-radius: 100px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2f4d42;
        }

        .option-btn:hover {
            background: #ffefcf;
            transform: scale(0.98);
            border-color: #e7a530;
        }

        .option-prefix {
            background: #c28534;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px;
            color: white;
            font-weight: bold;
        }

        /* Pop-up (modal explicativo) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fffaf0;
            max-width: 500px;
            width: 90%;
            border-radius: 48px;
            padding: 28px;
            text-align: center;
            animation: fadeIn 0.2s;
            border-top: 8px solid #f4b942;
        }

        .modal-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .modal-explanation {
            background: #ebf0e6;
            padding: 16px;
            border-radius: 28px;
            margin: 15px 0;
            font-size: 0.95rem;
            color: #2a5a45;
            text-align: left;
        }

        .modal-book {
            font-weight: bold;
            color: #b45f1b;
            margin-top: 8px;
        }

        .modal-close {
            background: #f3bc5c;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95);}
            to { opacity: 1; transform: scale(1);}
        }

        .next-btn {
            background: #2f7868;
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            color: white;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.1s;
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        .reset-btn {
            background: #aa6f42;
            margin-top: 12px;
        }

        footer {
            padding: 0 28px 28px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="minister-header">
        <div class="title-area">
            <h1>🏛️ MINISTRO DA ECONOMIA</h1>
            <p>Suas decisões moldam o país | Baseado na Unifatecie</p>
        </div>
        <div class="score-area">📊 ACERTOS: <span id="scoreCounter">0</span></div>
    </div>
    <div class="indicators">
        <div class="indicator">📈 PIB <div class="indicator-value" id="pibValue">100</div></div>
        <div class="indicator">🔥 INFLAÇÃO <div class="indicator-value" id="infValue">6.0%</div></div>
        <div class="indicator">👥 DESEMPREGO <div class="indicator-value" id="desValue">8.5%</div></div>
        <div class="indicator">👍 POPULARIDADE <div class="indicator-value" id="popValue">55%</div></div>
    </div>

    <div class="decision-area" id="decisionArea">
        <div class="question-card">
            <div class="question-text" id="questionText">Carregando...</div>
            <div class="context" id="contextText"></div>
            <div class="options" id="optionsContainer"></div>
        </div>
    </div>
    <footer>
        <button class="next-btn" id="nextBtn">▶ PRÓXIMA DECISÃO</button>
        <button class="next-btn reset-btn" id="resetBtn">🔄 REINICIAR MANDATO</button>
    </footer>
</div>

<!-- Modal Pop-up explicativo -->
<div id="explanationModal" class="modal">
    <div class="modal-content">
        <div class="modal-icon" id="modalIcon">⚖️</div>
        <div class="modal-title" id="modalTitle">Decisão Avaliada</div>
        <div class="modal-explanation" id="modalExplanation">
            Texto explicativo baseado na teoria econômica.
        </div>
        <div class="modal-book" id="modalBookRef">📖 Unifatecie - Economia</div>
        <button class="modal-close" id="closeModalBtn">CONTINUAR</button>
    </div>
</div>

<script>
    // --- JOGO DE DECISÕES (MINISTRO DA ECONOMIA) ---
    // Cada pergunta é uma decisão real com acerto ou erro.
    // Inclui várias questões sobre servidores públicos e gestão fiscal.
    // Indicadores reagem às respostas certas/erradas.
    
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;
    let gameFinished = false;
    
    // Indicadores dinâmicos (impactam com cada decisão certa/errada)
    let indicators = {
        pib: 100,
        inflacao: 6.0,
        desemprego: 8.5,
        popularidade: 55
    };
    
    // Lista de decisões (perguntas estilo "você é o ministro")
    const questions = [
        {
            text: "📌 REVISÃO DO FUNCIONALISMO PÚBLICO",
            context: "O funcionalismo público consome 40% do orçamento. Alguns conselheiros sugerem um plano de revisão de benefícios e aposentadorias para equilibrar as contas. Como ministro, você decide:",
            options: [
                { text: "Implementar revisão gradual com metas de produtividade e congelamento temporário de admissões", correct: true, effect: { pib: +2, inflacao: -0.5, desemprego: +0.2, popularidade: -2 }, explanation: "✅ Decisão correta! Medidas de ajuste fiscal sem demissões em massa ajudam a reduzir gasto público sem gerar colapso. O livro (Unidade IV - Política Fiscal) destaca que o controle de despesas melhora a confiança dos agentes." },
                { text: "Demitir 30% dos servidores efetivos imediatamente", correct: false, effect: { pib: -5, inflacao: -0.2, desemprego: +4, popularidade: -18 }, explanation: "❌ Decisão incorreta. Demissões abruptas causam aumento brutal do desemprego, queda de demanda e instabilidade social. O problema da escassez (Unidade II) precisa de soluções planejadas, não radicais." },
                { text: "Aumentar salários e contratar mais servidores para estimular consumo", correct: false, effect: { pib: +1, inflacao: +2.5, desemprego: -1, popularidade: +5 }, explanation: "❌ Risco alto! Expansão desordenada do funcionalismo amplia déficit público e pode gerar inflação de demanda. O equilíbrio fiscal é essencial segundo a política macroeconômica." }
            ]
        },
        {
            text: "🏦 REFORMA ADMINISTRATIVA",
            context: "O relatório aponta que o número de cargos comissioniros cresceu 50% nos últimos 5 anos. Para aumentar eficiência, o que fazer?",
            options: [
                { text: "Reduzir comissionismos e adotar avaliação de desempenho para todos os cargos", correct: true, effect: { pib: +2, inflacao: -0.3, desemprego: 0, popularidade: 0 }, explanation: "✅ Acerto! Enxugar privilégios e medir desempenho melhora a alocação de recursos e aumenta a produtividade do setor público. Tema da Unidade II: setores da economia e eficiência." },
                { text: "Ignorar, pois servidores públicos merecem estabilidade total sem avaliação", correct: false, effect: { pib: -1, inflacao: +0.4, desemprego: 0, popularidade: -3 }, explanation: "❌ Decisão questionável. A falta de eficiência gera desperdício e aumenta a carga tributária indireta. A economia lida com escassez; todo gasto deve gerar retorno social." },
                { text: "Privatizar todos os serviços públicos e demitir em massa", correct: false, effect: { pib: -2, inflacao: +0.5, desemprego: +3, popularidade: -15 }, explanation: "❌ Erro grave. Sem planejamento, gera desemprego estrutural e falhas na prestação de serviços essenciais. O estado possui funções alocativas importantes (bens públicos)." }
            ]
        },
        {
            text: "💰 VINCULAÇÃO ORÇAMENTÁRIA E SERVIDORES",
            context: "O teto de gastos está sendo pressionado. Alguns defendem que servidores devem ter reajuste anual pela inflação. Como agir?",
            options: [
                { text: "Reajuste nos limites da responsabilidade fiscal, baseado em produtividade e ganhos reais do PIB", correct: true, effect: { pib: 0, inflacao: -0.2, desemprego: 0, popularidade: +2 }, explanation: "✅ Correto. A Lei de Responsabilidade Fiscal exige equilíbrio. Reajustes atrelados à inflação sem ganho real são sustentáveis, desde que haja contrapartida." },
                { text: "Conceder aumento de 10% acima da inflação para agradar sindicatos", correct: false, effect: { pib: -1, inflacao: +1.3, desemprego: +0.4, popularidade: +4 }, explanation: "❌ Inflação de custos e déficit primário. O livro explica que aumentos reais permanentes sem ganhos de produtividade geram pressão inflacionária." },
                { text: "Congelar salários por 5 anos sem correção", correct: false, effect: { pib: -2, inflacao: -0.5, desemprego: +0.8, popularidade: -10 }, explanation: "❌ Decisão impopular e injusta. Pode reduzir moral do serviço público e prejudicar a qualidade, além de efeitos recessivos." }
            ]
        },
        {
            text: "📊 EFEITO DOS SERVIDORES NA DEMANDA AGREGADA",
            context: "Servidores públicos representam uma parcela importante do consumo. Em um momento de recessão, o que fazer?",
            options: [
                { text: "Manter salários e até antecipar parte do 13º para injetar liquidez", correct: true, effect: { pib: +3, inflacao: +0.4, desemprego: -0.6, popularidade: +6 }, explanation: "✅ Visão keynesiana! Em recessão, manter o poder de compra dos servidores estabiliza a demanda agregada. Unidade IV: política fiscal anticíclica." },
                { text: "Cortar salários em 20% para equilibrar contas agora", correct: false, effect: { pib: -4, inflacao: -0.8, desemprego: +2, popularidade: -20 }, explanation: "❌ Medida pró-cíclica piora a recessão. O livro ensina que o estado deve ampliar gastos em momentos de crise." },
                { text: "Privatizar empresas estatais e usar recursos para demitir funcionários", correct: false, effect: { pib: -2, inflacao: +0.2, desemprego: +1.5, popularidade: -12 }, explanation: "❌ Não resolve escassez no curto prazo e amplia desemprego." }
            ]
        },
        {
            text: "🎓 CONCURSOS PÚBLICOS E CAPITAL HUMANO",
            context: "Há necessidade de profissionais em saúde e educação. Como expandir o serviço público sem comprometer o orçamento?",
            options: [
                { text: "Realizar concursos específicos, mas com redução de cargos obsoletos e reforma de despesas", correct: true, effect: { pib: +1, inflacao: -0.1, desemprego: -0.3, popularidade: +3 }, explanation: "✅ Decisão equilibrada. Otimizar o quadro de pessoal, investindo em áreas prioritárias, melhora o bem-estar social. Conceito de bens públicos (Unidade II)." },
                { text: "Contratar sem critério, apenas para agradar bases políticas", correct: false, effect: { pib: -1, inflacao: +0.9, desemprego: -0.4, popularidade: -5 }, explanation: "❌ Clientelismo aumenta ineficiência, gera déficit e compromete a qualidade do gasto." },
                { text: "Proibir qualquer nova contratação por 10 anos", correct: false, effect: { pib: -3, inflacao: -0.2, desemprego: 0, popularidade: -7 }, explanation: "❌ Paralisa serviços essenciais. Educação e saúde sofrem, impacto negativo no capital humano de longo prazo." }
            ]
        },
        {
            text: "⚖️ SERVIDORES PÚBLICOS E PRIVATIZAÇÕES",
            context: "Estatais deficitárias acumulam prejuízos. Seu conselho sugere enxugar pessoal. Qual caminho?",
            options: [
                { text: "Programa de desligamento voluntário (PDV) com incentivo e requalificação profissional", correct: true, effect: { pib: +0.5, inflacao: -0.2, desemprego: +0.2, popularidade: 0 }, explanation: "✅ Correto. Minimiza danos sociais e reduz gastos futuros. O livro aborda economia e escolhas com eficiência." },
                { text: "Demitir unilateralmente todos os servidores da estatal", correct: false, effect: { pib: -3, inflacao: +0.1, desemprego: +2.8, popularidade: -14 }, explanation: "❌ Impacto social e elevação do desemprego abrupto, sem respeitar direitos. Escassez de recursos não justifica injustiça." },
                { text: "Manter prejuízos sem mudanças", correct: false, effect: { pib: -1.5, inflacao: +0.3, desemprego: 0, popularidade: -4 }, explanation: "❌ Adia problema e desperdiça recursos públicos que poderiam ser usados em saúde/educação." }
            ]
        },
        {
            text: "📉 INFLAÇÃO E REAJUSTE DOS SERVIDORES",
            context: "Inflação acumulada em 12% nos últimos 12 meses. Servidores pedem recomposição integral. Como decidir?",
            options: [
                { text: "Oferecer recomposição parcial + bônus por produtividade para evitar espiral inflacionária", correct: true, effect: { pib: 0, inflacao: -0.5, desemprego: 0, popularidade: +1 }, explanation: "✅ Política de rendas consciente. A indexação total alimenta inércia inflacionária (Unidade IV: inflação inercial). Melhor vincular a metas." },
                { text: "Conceder reajuste integral imediato", correct: false, effect: { pib: -1, inflacao: +0.8, desemprego: 0, popularidade: +5 }, explanation: "❌ Reforça a inflação (realimentação). O Plano Real quebrou a inércia justamente evitando indexação total." },
                { text: "Congelar salários e ignorar inflação", correct: false, effect: { pib: -2, inflacao: -0.2, desemprego: +0.6, popularidade: -15 }, explanation: "❌ Perda de poder de compra prejudica o consumo e gera insatisfação social." }
            ]
        },
        {
            text: "🌱 SUSTENTABILIDADE PREVIDENCIÁRIA",
            context: "Sistema previdenciário dos servidores tem déficit bilionário. Que reforma você propõe?",
            options: [
                { text: "Idade mínima progressiva + contribuição patronal revisada", correct: true, effect: { pib: +2, inflacao: -0.4, desemprego: +0.1, popularidade: -3 }, explanation: "✅ Reforma necessária para garantir sustentabilidade fiscal e evitar explosão da dívida. Economia estuda alocação intertemporal de recursos." },
                { text: "Manter regras antigas e aumentar impostos gerais", correct: false, effect: { pib: -1, inflacao: +0.5, desemprego: +0.3, popularidade: -2 }, explanation: "❌ Penaliza o setor produtivo e não resolve o déficit estrutural." },
                { text: "Extinguir a previdência dos servidores sem alternativas", correct: false, effect: { pib: -3, inflacao: +0.1, desemprego: +0.5, popularidade: -25 }, explanation: "❌ Medida inconstitucional e desastrosa socialmente, destruindo a confiança." }
            ]
        }
    ];
    
    // Atualiza interface dos indicadores
    function updateIndicatorsUI() {
        document.getElementById("pibValue").innerText = Math.round(indicators.pib);
        document.getElementById("infValue").innerText = indicators.inflacao.toFixed(1) + "%";
        document.getElementById("desValue").innerText = indicators.desemprego.toFixed(1) + "%";
        document.getElementById("popValue").innerText = Math.round(indicators.popularidade) + "%";
        document.getElementById("scoreCounter").innerText = score;
    }
    
    function applyIndicatorChanges(effect) {
        indicators.pib = Math.min(180, Math.max(40, indicators.pib + (effect.pib || 0)));
        indicators.inflacao = Math.min(30, Math.max(0.5, indicators.inflacao + (effect.inflacao || 0)));
        indicators.desemprego = Math.min(22, Math.max(2, indicators.desemprego + (effect.desemprego || 0)));
        indicators.popularidade = Math.min(100, Math.max(0, indicators.popularidade + (effect.popularidade || 0)));
        updateIndicatorsUI();
    }
    
    // Pop-up explicativo
    function showModal(title, explanation, isCorrect, bookRef = "📖 Unidade do livro Unifatecie - Economia") {
        const modal = document.getElementById("explanationModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalExplanation = document.getElementById("modalExplanation");
        const modalIcon = document.getElementById("modalIcon");
        const modalBook = document.getElementById("modalBookRef");
        
        modalIcon.innerText = isCorrect ? "✅ ACERTO!" : "❌ ERRO";
        modalTitle.innerText = isCorrect ? "Decisão Acertada" : "Decisão Incorreta";
        modalExplanation.innerHTML = explanation;
        modalBook.innerText = bookRef;
        modal.style.display = "flex";
        
        // fechar modal
        const closeBtn = document.getElementById("closeModalBtn");
        const closeModal = () => {
            modal.style.display = "none";
            // após fechar, se não acabou, habilita próximo
            if (!gameFinished) {
                document.getElementById("nextBtn").disabled = false;
            }
            canAnswer = true;
        };
        closeBtn.onclick = closeModal;
        window.onclick = (e) => { if (e.target === modal) closeModal(); };
    }
    
    let currentQuestion = null;
    
    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            // Fim do jogo
            gameFinished = true;
            document.getElementById("questionText").innerHTML = "🏆 MANDATO ENCERRADO 🏆";
            document.getElementById("contextText").innerHTML = `Você concluiu todas as decisões econômicas. Seus indicadores finais: PIB ${Math.round(indicators.pib)} | Inflação ${indicators.inflacao.toFixed(1)}% | Desemprego ${indicators.desemprego.toFixed(1)}% | Popularidade ${Math.round(indicators.popularidade)}%. Parabéns, Ministro! Baseado no conteúdo da Unifatecie.`;
            document.getElementById("optionsContainer").innerHTML = "";
            document.getElementById("nextBtn").innerText = "🏁 REINICIAR JOGO";
            document.getElementById("nextBtn").onclick = () => resetGame();
            return;
        }
        
        currentQuestion = questions[currentQuestionIndex];
        document.getElementById("questionText").innerHTML = currentQuestion.text;
        document.getElementById("contextText").innerHTML = currentQuestion.context;
        
        const optionsDiv = document.getElementById("optionsContainer");
        optionsDiv.innerHTML = "";
        currentQuestion.options.forEach((opt, idx) => {
            const btn = document.createElement("div");
            btn.className = "option-btn";
            const prefix = String.fromCharCode(65+idx);
            btn.innerHTML = `<div class="option-prefix">${prefix}</div><div>${opt.text}</div>`;
            btn.addEventListener("click", () => {
                if (!canAnswer || gameFinished) return;
                canAnswer = false;
                const isCorrect = opt.correct;
                if (isCorrect) {
                    score++;
                    document.getElementById("scoreCounter").innerText = score;
                }
                // aplicar efeitos nos indicadores
                if (opt.effect) applyIndicatorChanges(opt.effect);
                // mostrar pop-up explicativo
                let correctnessText = isCorrect ? "✅ DECISÃO CORRETA" : "❌ DECISÃO ERRADA";
                let fullExplanation = `<strong>${correctnessText}</strong><br>${opt.explanation}<br><br>📌 Consequência: PIB ${opt.effect.pib>=0? '+' : ''}${opt.effect.pib}, Inflação ${opt.effect.inflacao>=0? '+' : ''}${opt.effect.inflacao}, Desemprego ${opt.effect.desemprego>=0? '+' : ''}${opt.effect.desemprego}, Popularidade ${opt.effect.popularidade>=0? '+' : ''}${opt.effect.popularidade}.`;
                showModal(correctnessText, fullExplanation, isCorrect, "📚 Referência: Material Unifatecie - Micro/Macro/Políticas Públicas");
                // Desabilitar opções visuais
                document.querySelectorAll(".option-btn").forEach(b => b.style.opacity = "0.5");
            });
            optionsDiv.appendChild(btn);
        });
        document.getElementById("nextBtn").disabled = true;
        document.getElementById("nextBtn").innerText = "▶ PRÓXIMA DECISÃO";
        document.getElementById("nextBtn").onclick = () => {
            if (!canAnswer && !gameFinished) {
                currentQuestionIndex++;
                canAnswer = true;
                loadQuestion();
                document.getElementById("nextBtn").disabled = true;
                // reabilitar opções visual
            } else if (!canAnswer === false && !gameFinished) {
                // se ainda pode responder, bloqueia
                if (canAnswer) {
                    alert("Você precisa tomar uma decisão antes de avançar!");
                }
            }
        };
    }
    
    function resetGame() {
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;
        gameFinished = false;
        indicators = {
            pib: 100,
            inflacao: 6.0,
            desemprego: 8.5,
            popularidade: 55
        };
        updateIndicatorsUI();
        loadQuestion();
        document.getElementById("nextBtn").disabled = true;
        document.getElementById("nextBtn").innerText = "▶ PRÓXIMA DECISÃO";
    }
    
    // inicialização
    updateIndicatorsUI();
    loadQuestion();
    document.getElementById("resetBtn").addEventListener("click", resetGame);
</script>
</body>
